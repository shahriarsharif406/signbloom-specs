name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests (core logic)
        run: npm test
      - name: Type-check Lens Studio scripts (against local stubs)
        run: npm run typecheck:lens
      - name: Data-tool self-test
        run: python3 -I tools/derive_curls.py --selftest
